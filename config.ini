# ~/.config/undocked/config.ini (or $XDG_CONFIG_HOME/undocked/config.ini)
[undocked]
autoapply = true
# Require the same port even when the monitor EDID is unique.
match_ports = false
# When Linux exposes lid state, consider changes and skip auto-presets
# that enable the closed laptop panel. Recovery prefers an external display.
follow_lid = false
settle_ms = 650
confirm_seconds = 15
identify_seconds = 4
# Relative to this config directory. Absolute and ~/ paths also work.
presets = presets
# Optional shell command. Receives UNDOCKED_REASON, UNDOCKED_PRESET and DISPLAY.
after_change =

[ui]
width = 760
height = 500
snap_px = 14
corner_radius = 4
drawer_animation_ms = 160
# Comma-separated shortcuts, in order. Extra choices appear under More.
# Use row-top, row-center, row-bottom, column-left, column-center, column-right,
# y (two above, with three displays), mirror, or extend. Empty puts all under More.
quick_arrangements = row-center, column-center, y
# Empty uses the embedded Geist and Geist Mono faces.
# Set a TrueType or OpenType path here or in undocked.font / undocked.mono Xresources.
font =
mono =

[ports]
# Optional aliases, for example:
# DP-2-1 = Dock left
